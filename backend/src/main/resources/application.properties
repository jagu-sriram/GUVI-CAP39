
spring.application.name=cap39-backend

# Snowflake connection
spring.datasource.url=jdbc:snowflake://${SNOWFLAKE_ACCOUNT}.snowflakecomputing.com/?warehouse=SRIRAM_CAP39_WH&db=SRIRAM_CAP39_DB&schema=SRIRAM_APP&JDBC_QUERY_RESULT_FORMAT=JSON
spring.datasource.username=${SNOWFLAKE_USER}
spring.datasource.password=${SNOWFLAKE_PASSWORD}
spring.datasource.driver-class-name=net.snowflake.client.jdbc.SnowflakeDriver

spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=1

# Actuator
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always

# CSV upload configuration
cap39.upload-dir=/app/incoming

# Multipart upload limits
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB

# CAP39 Python ETL configuration
cap39.python-executable=${CAP39_PYTHON_EXECUTABLE:/opt/venv/bin/python}
cap39.python-project-dir=${CAP39_PYTHON_PROJECT_DIR:/opt/cap39-etl}
cap39.python-script=${CAP39_PYTHON_SCRIPT:/opt/cap39-etl/process_single_upload.py}
cap39.process-timeout-seconds=${CAP39_PROCESS_TIMEOUT_SECONDS:600}
cap39.etl-results-dir=${CAP39_ETL_RESULTS_DIR:/opt/cap39-etl/data/upload_runs}

# AWS S3
cap39.aws.region=${AWS_REGION:ap-south-1}
cap39.aws.bucket=${CAP39_S3_BUCKET:sriram-cap39-storage}
